<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <div class="form-container">
            <div>
                <input type="text" placeholder="Title" id="title"> 
                <input type="text" placeholder="Description" id="desc"> 
                <button onclick=addTodo()>Add+</button>
            </div>
            
        <div id="parent"></div>

        </div>
    </div>


    <script>
        let globalId = 10;
        function markDone(id) {
            const parent = document.getElementById(id);
            parent.children[2].innerHTML = "Done!"; // 0 title; 1 desc; 2 btn
        }

        function createChild(title, desc, id) {
            const child = document.createElement("div")

            const titleDiv = document.createElement("div"); // title
            const descDiv = document.createElement("div"); // desc
            const btn = document.createElement("button");

            titleDiv.innerHTML = title;
            descDiv.innerHTML = desc;
            btn.innerHTML = "Mark Done";
            btn.setAttribute("onclick", `markDone(${id})`) 

            child.appendChild(titleDiv);
            child.appendChild(descDiv);
            child.appendChild(btn);
            child.setAttribute("id", id); // id=1
            child.setAttribute("class", "parent-container")

            return child;
        }

        const state = [
            { title:"Hello", desc: "Good", id: 1 },
            { title:"kesa bhai", desc: "Boss", id: 2 },
            { title:"Twins", desc: "Delulu", id: 3 },
        ]

        function addTodo() {
            const title = document.getElementById("title").value;
            const desc = document.getElementById("desc").value;
            globalId++;
            state.push({ title, desc, id: globalId})
            renderList(state)
        }

        function renderList(state){
            const parent = document.getElementById("parent");
            parent.innerHTML = "";

            for(let i=0; i<state.length; i++){
                const child = createChild(state[i].todo, state[i].completed, state[i].id)
                parent.appendChild(child)
            }
        }
        
        async function loadTodo() {
            const res = await fetch("https://dummyjson.com/todos");
            const json = await res.json();
            renderList(json.todos)
        }

        loadTodo()


    </script>
</body>
</html>
