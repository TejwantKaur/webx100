<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="btnParent"></div>

    <script>
        let state = { count:0 }

        function onBtnPress(){
            state.count++;
            btnComponentReRender();
        }

        // reputting btn 
        function btnComponentReRender(){
            const parent = document.getElementById("btnParent");
            parent.innerHTML = "";
            const component = btnComponent(state.count);
            parent.appendChild(component)
        }
        function btnComponent(count){
            const btn = document.createElement("button")
            btn.innerHTML = `Counter ${count}`;
            btn.setAttribute('onclick', 'onBtnPress()')
            console.log(btn)
            return btn
        }

        btnComponentReRender()
    </script>
</body>
</html>
